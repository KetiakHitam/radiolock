<!doctype html>
<html lang="en" style="background:#141311">
<head>
<meta charset="utf-8">
<style>html,body{background:#141311;color:#efe6d6;margin:0}</style>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radiolock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=8">
</head>
<body>
<div id="app">
  <form id="searchForm" class="search" autocomplete="off">
    <input id="searchInput" type="text" placeholder="Search YouTube or paste a link" spellcheck="false">
    <button id="searchBtn" type="submit">Search</button>
  </form>

  <div class="status">
    <span id="sourceChip" class="chip">Starting...</span>
    <span id="notice" class="notice"></span>
  </div>

  <section class="now">
    <div id="artBox" class="art"><div id="artImg" class="artImg"></div><div id="ytHost"></div></div>
    <div class="nowMain">
      <div id="nowTitle" class="nowTitle">Nothing playing</div>
      <div id="nowArtist" class="nowArtist"></div>
      <div class="bar"><div id="barFill" class="barFill"></div></div>
      <div class="times"><span id="timeCur">0:00</span><span id="timeDur">0:00</span></div>
    </div>
    <div class="ctrls">
      <button id="btnFav" class="ctrl fav" title="Favorite" hidden><svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4h2c.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg></button>
      <button id="btnPrev" class="ctrl" title="Previous">&#9198;</button>
      <button id="btnPlay" class="ctrl play" title="Play">&#9654;</button>
      <button id="btnNext" class="ctrl" title="Next">&#9197;</button>
      <button id="btnRepeat" class="ctrl repeat" title="Repeat: off"><svg viewBox="0 0 24 24" width="17" height="17"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg><span class="one">1</span></button>
    </div>
  </section>

  <nav class="tabs">
    <button data-list="results" class="tab on">Results</button>
    <button data-list="queue" class="tab">Up next</button>
    <button data-list="folder" class="tab">Folder</button>
    <button data-list="favorites" class="tab">Favorites</button>
    <button data-list="recent" class="tab">Recent</button>
    <button data-list="playlists" class="tab">Playlists</button>
  </nav>
  <div id="plBar" class="folderBar" hidden>
    <button id="plBack" type="button" class="ghost">Back</button>
    <span id="plTitle" class="folderPath plTitle"></span>
    <input id="plNameInput" class="plName" type="text" maxlength="80" spellcheck="false" hidden>
    <button id="plPlay" type="button">Play</button>
    <button id="plShuffle" type="button" class="ghost">Shuffle</button>
    <button id="plMore" type="button" class="ghost">...</button>
    <button id="plNew" type="button" class="ghost">New playlist</button>
  </div>
  <div id="libBar" class="folderBar" hidden>
    <span id="libCount" class="folderPath"></span>
    <button id="btnPlayFav" type="button" class="ghost">Play all</button>
    <button id="btnShuffleFav" type="button">Shuffle favorites</button>
  </div>
  <div id="folderBar" class="folderBar" hidden>
    <span id="folderPathLbl" class="folderPath"></span>
    <button id="pickBtn" type="button">Choose folder</button>
  </div>
  <ul id="list" class="list"></ul>
  <div id="empty" class="empty"></div>
</div>
<div id="menu" class="menu" hidden></div>
<audio id="audio" crossorigin="anonymous" preload="auto"></audio>
<script src="app.js?v=8"></script>
</body>
</html>
